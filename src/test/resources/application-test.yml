# 测试环境配置：
# - 使用独立测试库 ecommerce_test（自动创建）+ Redis DB15，不污染开发数据
# - 禁用 Sentinel / 排除 RocketMQ 自动装配，避免依赖未启动的外部中间件
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: EcommerceHikariCPTest
      # 与 dev / prod 口径对齐（原为 30，是"池越大越好"的旧思路残留）。
      # 集成测试同样走真实 MySQL，池子过大只会让并发用例放大 InnoDB 锁争用与上下文切换，
      # 测出来的东西反而不代表线上。connection-timeout 保持 3s 快速失败，
      # 让"连接拿不到"直接暴露成失败，而不是无限堆积把用例拖到超时。
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 3000
      validation-timeout: 1000
      connection-test-query: SELECT 1
      # 刻意不开 leak-detection-threshold：下单流程是 @Transactional 包住 Redisson 锁等待，
      # 并发用例里"拿着连接等锁"是预期行为（inventory-lock-wait-seconds: 30），
      # 开了会刷一堆假泄漏告警，反而掩盖真问题。
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
      timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-test.sql
      continue-on-error: false
  cloud:
    sentinel:
      enabled: false
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

# 关闭自定义 Sentinel 规则初始化（避免依赖 Sentinel 文件日志，测试环境偶发 JUL NPE）
ecommerce:
  sentinel:
    enabled: false
  business:
    # 并发测试环境调大锁等待，避免机器负载高时"获取锁超时"导致偶发丢单
    inventory-lock-wait-seconds: 30

# redisson-spring-boot-starter 部分版本读取 spring.redis 前缀，双写保证锁也走 DB15 隔离
spring.redis.database: 15

logging:
  level:
    com.ecommerce: info
    org.redisson: warn