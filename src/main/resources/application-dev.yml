# ==================== 本地开发环境 ====================
# 连接本机 MySQL / Redis / Nacos / Sentinel / RocketMQ（docker-compose 可一键启动）
spring:
  # MySQL + HikariCP
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      pool-name: EcommerceHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

  # Sentinel（Dashboard 未启动只影响可视化，不影响业务）
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: 8719
      # 取消懒加载：项目启动时就初始化 Sentinel 并与 Dashboard 建立心跳
      eager: true
      application-name: ${spring.application.name}
      # 开启 Sentinel 对 Feign 的支持（熔断降级）
      feign:
        enabled: true

# RocketMQ（未启动时下单主流程不受影响；超时关单由定时扫描兜底补偿，见 OrderTimeoutScanScheduler）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ecommerce-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# 开发环境打印 SQL 与 debug 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.ecommerce: debug
    org.redisson: warn
    com.ecommerce.feign: debug