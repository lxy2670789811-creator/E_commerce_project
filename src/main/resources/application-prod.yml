# ==================== 生产环境 ====================
# 所有敏感信息必须通过环境变量注入（无默认值，缺失会导致启动失败）
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      pool-name: EcommerceHikariCP
      # 连接池不是越大越好：每多一条连接 = MySQL 多一个线程，会放大上下文切换与 InnoDB 锁争用。
      # 经验公式 核心数*2 + 磁盘数。压测显示"连接不够用"通常是慢查询占着连接不还，
      # 靠调大池子救不了慢查询，反而会让慢查询一起挤爆 MySQL。故收敛到合理值。
      minimum-idle: 5
      maximum-pool-size: 15        # 4~8 核实例 10~20 足够，别再用 50
      connection-timeout: 3000     # 拿不到连接 3 秒快速失败，别让线程在池上无限堆积(堆积会拖垮 Tomcat 线程池)
      validation-timeout: 1000     # 校验连接超时，须小于 connection-timeout
      idle-timeout: 600000         # 空闲 10 分钟回收(须小于 max-lifetime)
      max-lifetime: 1800000        # 连接上限 30 分钟强制轮换，防 MySQL 侧 wait_timeout 断连
      leak-detection-threshold: 30000  # 连接超 30s 未归还打泄漏告警日志，用于定位"谁长期占连接"的慢查询/事务
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD}
        port: 8719
      eager: true
      application-name: ${spring.application.name}
      feign:
        enabled: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER}
  producer:
    group: ecommerce-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

deepseek:
  api:
    url: https://api.deepseek.com/v1/chat/completions
    key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
    timeout-seconds: 30

# 生产环境不输出 SQL 到控制台
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.ecommerce: info
    org.redisson: warn
    org.apache.rocketmq: warn