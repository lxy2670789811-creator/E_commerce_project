# ==================== 公共配置（所有环境共享） ====================
# 默认激活 dev 环境；生产环境启动时指定 --spring.profiles.active=prod
spring:
  profiles:
    default: dev
  application:
    name: e-commerce-order-backend

  # --- 优雅停机最长等待（云原生 L0）---
  # 含义：从发出停机信号到容器真正关闭的总预算，包含在途请求处理与 Bean 销毁。
  # 取值依据：本应用最慢的两条链路 ——
  #   下单：Redisson 锁等待上限 5s（inventory-lock-wait-seconds）+ 事务执行 → 远小于 30s，安全；
  #   AI 售后：Feign readTimeout 就是 30s → 恰好卡在边界。
  # ⚠️ 已知边界（刻意不改，记录在案）：AI 链路恰好跑满 30s 时会被截断。
  #    可接受的原因：该接口有 fallback 降级（返回 null → 走人工审核），且属辅助功能非交易主链路。
  #    若要彻底覆盖，正确做法是先把 AI 的 readTimeout 从 30s 收敛到 10~15s，而不是把这里调大 ——
  #    停机等待越久，滚动更新就越慢，Pod 数多时一次发布要拖很久。
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api
  # --- 优雅停机（云原生 L0）---
  # graceful：收到 SIGTERM 后先停止接收新请求，等"在途请求"处理完再关闭容器。
  # Spring Boot 默认是 immediate —— 立刻关闭 Tomcat，正在执行的下单请求会被硬切，
  # 对"扣库存 + 写订单 + 发延迟消息"这种多步操作存在中间态风险。
  #
  # ⚠️ 必须与 K8s 侧配合，否则配置形同虚设：
  #    Pod spec 的 terminationGracePeriodSeconds 必须 > spring.lifecycle.timeout-per-shutdown-phase，
  #    建议 45s（30s 停机 + 15s 收尾余量）。否则在途请求还没跑完就被 SIGKILL。
  #    另外 preStop 建议 sleep 5~10s：K8s 发 SIGTERM 与 Endpoint 从 Service 摘除是并行的，
  #    不等待的话仍会有新请求被打到正在停机的 Pod 上。
  shutdown: graceful

# MyBatis-Plus（环境相关的 SQL 日志在 dev/prod 中配置）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ecommerce.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j / SpringDoc
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true

# 业务配置（本地默认值，可被 Nacos 中的 ecommerce-business.yaml 动态覆盖并刷新）
ecommerce:
  business:
    # --- 分布式锁 ---
    inventory-lock-lease-seconds: 30       # 库存锁持有超时（秒）；设为-1启用看门狗自动续期
    inventory-lock-wait-seconds: 5         # 库存锁最大等待（秒）
    # --- AI 大模型 ---
    ai-api-timeout-seconds: 30              # AI API 超时（秒）
    ai-api-retry-times: 1                   # AI API 重试次数（0-3，非幂等接口不宜过大）
    after-support-enabled: true             # 售后功能总开关
    ai-rate-limit-max-requests: 10          # AI 限流 - 时间窗口内最大请求数
    ai-rate-limit-time-window-seconds: 60   # AI 限流 - 时间窗口（秒）
    # --- Sentinel 熔断兜底阈值（控制台配置优先） ---
    order-create-qps-threshold: 100         # 下单 QPS 流控阈值
    ai-analyze-slow-ratio-threshold: 0.6    # AI 慢调用比例熔断阈值
    ai-analyze-min-request-amount: 5        # AI 熔断最小请求数
    ai-analyze-stat-interval-ms: 60000      # AI 熔断统计窗口（毫秒）
    ai-analyze-time-window: 30              # AI 熔断时长（秒）
    deepseek-error-ratio-threshold: 0.5     # Feign 异常比例熔断阈值
    # --- 缓存 ---
    product-detail-expire-seconds: 3600     # 商品详情缓存过期（秒）
    product-detail-expire-jitter-seconds: 300   # 过期时间随机抖动上限（秒，防缓存雪崩；0=关闭）
    product-detail-null-cache-expire-seconds: 120 # 空值缓存过期（秒，防缓存穿透；0=关闭）
    product-detail-rebuild-lock-enabled: true    # 缓存击穿防护开关（singleflight 互斥重建）
    product-detail-rebuild-lock-lease-seconds: 5  # 重建锁自动释放超时（秒，≈回源上限；非越大越好，越长则"保护失效窗口"越长）
    product-detail-rebuild-lock-budget-millis: 1000 # 重建等待总预算（毫秒，硬上限；0=不等，直接降级）
    product-detail-rebuild-lock-backoff-millis: 20 # 重建等待起始片长（毫秒，每轮翻倍并带抖动）
    product-detail-rebuild-lock-degrade-max-concurrency: 8 # 降级直查DB的并发上限（0=不封顶；超出快速失败）
    # --- 订单超时未支付自动关单（RocketMQ 延迟消息 + 定时扫描兜底） ---
    order-timeout-cancel-enabled: true      # 超时关单总开关
    order-timeout-cancel-delay-level: 9     # 延迟级别（9=5分钟，详见 BusinessDynamicConfig）
    order-timeout-scan-enabled: true        # 定时扫描兜底开关（RocketMQ 失效时的补偿）
    order-timeout-scan-cron: "0 */1 * * * ?" # 扫描 cron（Spring 6位格式，默认每分钟）
    order-timeout-seconds: 300              # 超时阈值（秒，默认5分钟，与延迟级别9对齐）
    order-timeout-scan-batch-size: 100      # 单批扫描处理上限
    # --- 下单幂等（一次性凭证） ---
    order-token-enabled: true               # 凭证校验开关：false 时仅由数据库唯一索引兜底
    order-token-expire-seconds: 300         # 凭证有效期（秒）：进入下单页领取后 5 分钟内有效
    # --- JWT 认证配置（secret 生产必须用环境变量覆盖，勿硬编码） ---
    jwt:
      secret: ${JWT_SECRET:ecommerce-order-demo-secret-key-please-change-in-prod-0123456789}  # HMAC 签名密钥，≥32字节
      expire-seconds: 86400      # token 有效期（秒），默认 1 天
      required: false            # 硬鉴权开关：true=受保护路径必须带有效token；false=兼容模式（缺token放行，用userId参数）
      allow-plain-text-login: true  # 允许存量明文密码自动升级为 BCrypt（生产稳定后可置 false）

# DeepSeek AI 配置（密钥从环境变量读取，未设置时 AI 售后自动走"待人工审核"降级）
deepseek:
  api:
    url: https://api.deepseek.com/v1/chat/completions
    key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    timeout-seconds: 30

# ==================== OpenFeign 配置 ====================
feign:
  # 开启 Feign 与 Sentinel 的整合（使 @FeignClient 支持熔断降级）
  sentinel:
    enabled: true
  # 全局超时设置（单位：毫秒）；具体 Feign 客户端可在配置中单独覆盖
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
        # Feign 日志级别：NONE/BASIC/HEADERS/FULL（调试时用 FULL）
        loggerLevel: BASIC
      # DeepSeek Feign 客户端单独配置超时（毫秒）
      deepseekClient:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: FULL

# ==================== 云原生 L0：Actuator 与 K8s 探针 ====================
# 端点路径（注意 context-path=/api，探针 URL 必须带上它）：
#   存活探针  GET /api/actuator/health/liveness
#   就绪探针  GET /api/actuator/health/readiness
#
# ⚠️ 两个探针的语义不能混 —— 这是最容易配错、后果也最严重的一处：
#   liveness  = "进程是不是卡死了"，失败 → K8s 重启容器
#   readiness = "现在能不能接流量"，失败 → K8s 只把 Pod 从 Service 摘掉，不重启
#   所以 DB / Redis / RocketMQ 的健康度只能进 readiness。
#   一旦把 Redis 连通性放进 liveness，Redis 抖一下 K8s 就会把**所有** Pod 重启 ——
#   本来只是"暂时不可用"，会被放大成"全站崩溃"。
management:
  endpoints:
    web:
      exposure:
        # L0 只开健康检查与基本信息。metrics / prometheus / env / beans 留到 L3 再开，
        # 它们会暴露线程池配置、环境变量等内部信息，不适合默认放行。
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # 启用 liveness / readiness 分组（默认只有聚合的 /health）
      show-details: never  # 探针端点不返回 DB 地址、磁盘用量等内部细节
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true        # 发布后可通过 /api/actuator/info 核对跑的是哪个 profile

# 端口取舍（刻意不与业务端口分离）：
#   管理端点与业务共用 8080，外部访问由 Ingress 的路径规则拦截 /actuator。
#   分离端口（management.server.port）确实更安全 —— Service 只暴露业务端口、
#   探针走 Pod IP 直连管理端口，集群内其它 Pod 都访问不到。
#   但本项目是单体内部系统，Knife4j 文档本来就开在 8080，health 又不返回细节，
#   同端口省一个要管的端口，收益大于成本。将来若要公网暴露，再改分离端口。