# ==================== 后端敏感配置（模板） ====================
#
# 使用方式：
#   cp secret.example.yaml secret.yaml
#   # 编辑 secret.yaml 填入真实值
#   kubectl apply -f secret.yaml
#
# ⚠️ secret.yaml 已在 .gitignore 里排除，**不要**把它提交上来。
#    本文件（secret.example.yaml）只保留占位符，随仓库走没问题。
#
# ⚠️ 部署顺序：Secret 必须先于 Deployment 存在。
#    否则 Pod 会卡在 CreateContainerConfigError，报 "secret not found"。
#    这里刻意**不**给 secretRef 加 optional:true —— 那样 Pod 能起来，
#    但应用会因为缺密码在启动时抛异常，错误位置离真正原因更远。
#
# --- 关于 Secret 的安全边界（面试常被追问）---
# 这里的 Secret 只是 base64 编码，**不是加密**：任何能读 etcd 或能 create pod 的人
# 都能拿到明文。生产环境应至少做到其中一条：
#   1. 开启 etcd 静态加密（EncryptionConfiguration，aescbc/kms provider）
#   2. 用 External Secrets Operator / Vault 从密钥管理系统注入，仓库里只存引用
#   3. 用 SealedSecrets，密文可以安全地进 Git，由集群内控制器解密
# 本项目作为演示环境用模板 + 手动创建，但要知道这是最弱的一档。
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-backend-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-backend
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # --- 数据库账号 ---
  MYSQL_USERNAME: "REPLACE_ME"
  MYSQL_PASSWORD: "REPLACE_ME"

  # --- Redis ---
  # 无密码时留空字符串即可（prod 里是 ${REDIS_PASSWORD:}，允许为空）。
  REDIS_PASSWORD: ""

  # --- JWT 签名密钥 ---
  # ⚠️ 必须 ≥32 字节（HMAC-SHA256 要求），且**不能**用 application.yml 里那个默认值。
  #    默认值 "ecommerce-order-demo-secret-key-..." 已随公开仓库公开，
  #    用它等于任何人都能伪造 token 登录任意账号（含管理员）。
  #    生成方式：openssl rand -base64 48
  JWT_SECRET: "REPLACE_ME_AT_LEAST_32_BYTES_USE_openssl_rand_base64_48"

  # --- DeepSeek API Key ---
  DEEPSEEK_API_KEY: "sk-REPLACE_ME"
