# ==================== 前端 nginx 配置 ====================
# 单一来源：由 kustomization.yaml 的 configMapGenerator 从这个文件生成 ConfigMap，
# 再挂载到容器的 /etc/nginx/conf.d/default.conf。
#
# 为什么不 COPY 进镜像：
#   配置烘进镜像意味着"改一行缓存策略要重新构建、推送、拉取整个镜像"。
#   走 ConfigMap 后，改配置只需重新 apply，同一份镜像能从测试环境一路推到生产
#   —— 这是"配置分离"的实际意义，不只是形式。
#
# 为什么用 configMapGenerator 而不是手写 ConfigMap：
#   generator 会在 ConfigMap 名字里加内容 hash 后缀，于是"改了配置"必然导致
#   Deployment 引用的名字变化，从而**自动触发一次滚动更新**。
#   手写 ConfigMap 的话，apply 之后 Pod 不会感知，必须自己记得
#   `kubectl rollout restart` —— 而人一定会忘。
#
# 本地校验配置语法（不用启动 K8s）：
#   docker run --rm -v "$PWD/deploy/k8s/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginxinc/nginx-unprivileged:1.27-alpine nginx -t

server {
    # 监听 8080 而不是 80：非 root 进程不能绑定 <1024 的特权端口，
    # 而 nginx-unprivileged 镜像正是按"非 root"设计的（Service 对外仍是 80，用户无感知）。
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器里的日志必须走 stdout/stderr，否则 kubectl logs 看不到、日志采集也拿不到。
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;
    charset utf-8;

    # ---------- 探针端点 ----------
    # 前端没有下游依赖，一个返回 200 的轻量端点就是最合适的探针目标。
    # 刻意不放在 /api 下，避免和"反代路径"产生歧义。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---------- 管理端点黑洞（兜底） ----------
    # Ingress 已用 server-snippet 挡住了 /api/actuator 的正常路径。
    # 这条是兜底：万一 snippet 注解因权限被禁用（ingress-nginx ≥1.9 默认禁用），
    # 或有人直连前端 Pod 端口，这里显式返回 404。
    #
    # 为什么必须显式 404、不能靠下面的 SPA fallback 兜：
    #   那会返回 200 + HTML，等于向扫描器宣告"这个路径存在"。
    location ^~ /api/actuator {
        access_log off;
        return 404;
    }

    # ---------- 反向代理后端 ----------
    # 主路径是 Ingress 把 /api 直接分给后端 Service，流量**不经过**这里。
    # 保留这段的目的：前端容器能独立运行自测（docker run 起来就有完整功能），
    # 以及 Ingress 分流规则配错时的第二道保险。
    location /api/ {
        # ⚠️ 这里故意**不带** URI 后缀（不是 http://ecommerce-backend:8080/）。
        #    nginx 规则：proxy_pass 带 URI 时会用它替换 location 匹配到的前缀，
        #    加一个尾斜杠就会把 /api 吃掉，变成请求后端的 /orders 而不是 /api/orders
        #    —— 后端 context-path 是 /api，于是稳定 404。这是 nginx 反代最经典的坑。
        proxy_pass http://ecommerce-backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # 后端 AI 售后接口的 Feign readTimeout 是 30s，这条链路的读超时必须比它长，
        # 否则 nginx 先断连接，用户看到 504 而后端其实还在正常处理。
        proxy_read_timeout    60s;
    }

    # ---------- 静态资源长缓存 ----------
    # Vite 产物文件名带内容 hash（app.a1b2c3.js），内容变了文件名就变，
    # 所以可以放心给一年 + immutable：浏览器连问都不会问。
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 入口 HTML 不缓存 ----------
    # index.html 引用的是带 hash 的资源名，一旦被缓存住，
    # 发版后用户还在用旧 HTML → 去请求已被删除的旧 hash 文件 → 白屏。
    # 这是 SPA 上线最常见的"我这儿是好的啊"故障。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------- SPA 路由兜底 ----------
    # vue-router 用 history 模式，/orders/123 这类路径服务端没有对应文件，
    # 必须回落到 index.html 交给前端路由，否则用户一刷新页面就 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
}
